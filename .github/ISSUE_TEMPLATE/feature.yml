name: Feature request
description: An idea to improve ligungi.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or hard to do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposal
      description: How you imagine it working. If lichess does something similar, a link or screenshot helps.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself.
