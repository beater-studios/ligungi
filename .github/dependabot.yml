version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Keep exact pins: bump the version in package.json instead of widening ranges.
    versioning-strategy: increase
    # Same window as min-release-age in .npmrc. Security updates are not delayed by it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types follow the Node runtime pinned in .nvmrc; bump them together with it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  # Node.js images: no cooldown, so security releases of Node arrive as soon as they are published.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    ignore:
      # A new Node major changes .nvmrc, engines and the image together; do it by hand.
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope
