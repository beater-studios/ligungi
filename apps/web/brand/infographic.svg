  <text x="96" y="132" font-family="'Noto Sans', sans-serif" font-size="64" fill="#e8e6e3">Gungi at a glance</text>
  <text x="98" y="184" font-family="'Noto Sans', sans-serif" font-size="28" fill="#8f8a83">The board game from HUNTER×HUNTER, with the official 2022 rules</text>
  <rect x="96" y="236" width="414" height="222" rx="14" fill="#262421" stroke="#3a3632"/>
  <text x="124" y="318" font-family="'Noto Sans', sans-serif" font-size="64" font-weight="700" fill="#d8443f">9×9</text>
  <text x="260" y="314" font-family="'Noto Sans', sans-serif" font-size="30" fill="#e8e6e3">board</text>
  <text x="124" y="366" font-family="'Noto Sans', sans-serif" font-size="25" fill="#bdb8b0">Each player starts in their own</text>
  <text x="124" y="400" font-family="'Noto Sans', sans-serif" font-size="25" fill="#bdb8b0">3 rows.</text>
  <rect x="534" y="236" width="414" height="222" rx="14" fill="#262421" stroke="#3a3632"/>
  <text x="562" y="318" font-family="'Noto Sans', sans-serif" font-size="64" font-weight="700" fill="#d8443f">25</text>
  <text x="658" y="314" font-family="'Noto Sans', sans-serif" font-size="30" fill="#e8e6e3">pieces each</text>
  <text x="562" y="366" font-family="'Noto Sans', sans-serif" font-size="25" fill="#bdb8b0">14 kinds, from the Marshal to</text>
  <text x="562" y="400" font-family="'Noto Sans', sans-serif" font-size="25" fill="#bdb8b0">the Soldiers.</text>
  <rect x="972" y="236" width="414" height="222" rx="14" fill="#262421" stroke="#3a3632"/>
  <text x="1000" y="318" font-family="'Noto Sans', sans-serif" font-size="64" font-weight="700" fill="#d8443f">3</text>
  <text x="1056" y="314" font-family="'Noto Sans', sans-serif" font-size="30" fill="#e8e6e3">pieces high</text>
  <text x="1000" y="366" font-family="'Noto Sans', sans-serif" font-size="25" fill="#bdb8b0">Stack on a piece: the higher</text>
  <text x="1000" y="400" font-family="'Noto Sans', sans-serif" font-size="25" fill="#bdb8b0">the top one stands, the farther</text>
  <text x="1000" y="434" font-family="'Noto Sans', sans-serif" font-size="25" fill="#bdb8b0">it reaches.</text>
  <rect x="1410" y="236" width="414" height="222" rx="14" fill="#262421" stroke="#3a3632"/>
  <text x="1438" y="318" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="64" font-weight="700" fill="#d8443f">帥</text>
  <text x="1518" y="314" font-family="'Noto Sans', sans-serif" font-size="30" fill="#e8e6e3">the goal</text>
  <text x="1438" y="366" font-family="'Noto Sans', sans-serif" font-size="25" fill="#bdb8b0">Capture the Marshal, or leave</text>
  <text x="1438" y="400" font-family="'Noto Sans', sans-serif" font-size="25" fill="#bdb8b0">it with no safe move.</text>
